server:
  port: 9090

spring:
  datasource:
    url: jdbc:mariadb://localhost:3306/payments
    username: root
    password: 27901
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate.jdbc.time_zone: UTC
      hibernate.dialect: org.hibernate.dialect.MariaDB106Dialect
      hibernate.show_sql: false
    show-sql: false
    database-platform: org.hibernate.dialect.MariaDB106Dialect

  flyway:
    enabled: false

  cache:
    type: redis

  redis:
    host: localhost
    port: 6379
    timeout: 2000ms

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true

client-verify:
  base-url: https://signal.avinertech.com
  timeout-ms: 1500
  cache-ttl-seconds: 60

resilience4j:
  retry:
    instances:
      clientVerify:
        maxAttempts: 3
        waitDuration: 200ms
  circuitbreaker:
    instances:
      clientVerify:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 60000ms
        minimumNumberOfCalls: 5

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tags-sorter: alpha

logging:
  level:
    root: INFO
    payments.avinertech.gateways: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
